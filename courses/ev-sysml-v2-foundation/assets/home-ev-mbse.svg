<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">EV SysML v2 modeling course visual</title>
  <desc id="desc">An electric vehicle engineering scene with SysML model nodes for structure, ports, behavior, requirements, analysis, and verification.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#e8f4ef"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b5f92"/>
      <stop offset="0.52" stop-color="#1769aa"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="battery" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#147a4d"/>
      <stop offset="1" stop-color="#61b987"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
